name: automerge

# Label-gated unattended merge for agent PRs.
# A PR carrying the `automerge` label is merged to master once the local gate
# (lint + test + build) passes against the *current* master — not a stale base.
# See docs/adr or the team note: repo has no other CI; this workflow IS the gate.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

# Serialize merges per base branch so two labeled PRs can't merge against the
# same master concurrently. The second run waits, then re-checks out the now
# advanced master and re-gates against the real combination (handles the
# app.ts / agent.ts / App.tsx / ports.ts collision hotspots).
concurrency:
  group: automerge-${{ github.event.pull_request.base.ref }}
  cancel-in-progress: false

jobs:
  gate-and-merge:
    if: contains(github.event.pull_request.labels.*.name, 'automerge')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      # Check out the live base branch (master at job-run time), not the PR's
      # precomputed merge ref, so a PR that merged while we were queued is
      # already reflected here.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0

      - name: Merge PR head into current base
        run: |
          git config user.name "sofa-automerge[bot]"
          git config user.email "sofa-automerge@users.noreply.github.com"
          git fetch origin "pull/${{ github.event.pull_request.number }}/head:pr-head"
          if ! git merge --no-edit pr-head; then
            echo "::error::PR conflicts with current master — needs a manual merge commit (see orchestration notes: never rebase+force-push)."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

      # Gate is green against live master. Merge the PR itself (squash) so the
      # recorded merge matches exactly what we just tested.
      - name: Squash-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge "${{ github.event.pull_request.number }}" --squash --delete-branch

      # Close the linked issue deterministically instead of relying on a `Closes #N`
      # keyword in the PR body. The body-keyword path silently fails to auto-close
      # whenever the link wasn't registered — a PR stacked on a non-master base, a
      # run that dropped `--body`, or a misformatted number — leaving merged work
      # with an open issue. The branch name (`issue-<n>-<slug>`) is the reliable
      # source of the issue number, so derive it here and close from the same job
      # that did the merge. Best-effort: a non-issue branch or already-closed issue
      # must not fail the run.
      - name: Close the linked issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          n="$(echo "${{ github.event.pull_request.head.ref }}" | sed -nE 's/^issue-([0-9]+)-.*/\1/p')"
          if [ -n "$n" ]; then
            echo "Closing linked issue #$n"
            gh issue close "$n" --reason completed --comment "Closed by merged PR #${{ github.event.pull_request.number }}." || true
          else
            echo "Head ref '${{ github.event.pull_request.head.ref }}' is not an issue-<n>-* branch; nothing to close."
          fi
